<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1160" viewBox="0 0 1360 1160">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .bg{fill:#f8fafc}
    .title{font:700 28px 'Microsoft YaHei','Segoe UI',Arial,sans-serif;fill:#0f172a}
    .box{fill:#ffffff;stroke:#475569;stroke-width:1.4;rx:8;filter:url(#shadow)}
    .decision{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5;filter:url(#shadow)}
    .term{fill:#fee2e2;stroke:#991b1b;stroke-width:1.5;rx:8;filter:url(#shadow)}
    .ok{fill:#ecfdf5;stroke:#047857;stroke-width:1.5;rx:8;filter:url(#shadow)}
    .nodeText{font:500 16px 'Microsoft YaHei','Segoe UI',Arial,sans-serif;fill:#111827}
    .edge{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .edgeText{font:600 14px 'Microsoft YaHei','Segoe UI',Arial,sans-serif;fill:#334155}
  </style>
<rect class="bg" x="0" y="0" width="1360" height="1160"/>
<text class="title" x="680" y="44" text-anchor="middle">sub_2DC0 relocation 子流程</text>
<path class="edge" d="M680,154 L680,186"/>

<path class="edge" d="M680,258 L680,306"/>

<path class="edge" d="M534,352 L360,358"/>
<text class="edgeText" x="447" y="349" text-anchor="middle">否</text>
<path class="edge" d="M680,398 L680,440"/>
<text class="edgeText" x="680" y="413" text-anchor="middle">是</text>
<path class="edge" d="M680,512 L680,560"/>

<path class="edge" d="M680,652 L680,690"/>
<text class="edgeText" x="680" y="665" text-anchor="middle">否</text>
<path class="edge" d="M826,606 L960,612"/>
<text class="edgeText" x="893" y="603" text-anchor="middle">是</text>
<path class="edge" d="M680,762 L680,804"/>

<path class="edge" d="M1120,648 L1120,690"/>

<path class="edge" d="M1120,762 L1120,804"/>

<path class="edge" d="M1120,896 L1120,1040"/>
<text class="edgeText" x="1120" y="962" text-anchor="middle">是</text>
<path class="edge" d="M974,850 L400,970"/>
<text class="edgeText" x="687" y="904" text-anchor="middle">否</text>
<path class="edge" d="M240,1006 L240,1040"/>
